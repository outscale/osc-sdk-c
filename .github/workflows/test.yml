name: osc-sdk-C tests
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
jobs:
  auto-build:
    runs-on: [authenticated, Linux]
    permissions:
      # required for all workflows
      security-events: write

      # only required for workflows in private repositories
      actions: read
      contents: read
      id-token: write
    steps:
    - name: 🔒🧹 Setup Vault & Frieza
      id: secrets
      uses: outscale/.github/vault-frieza-clean@eb7bd1e0360703d0ad355bce46029ae8d49bac04
      with:
        vault_role: outscale-osc-sdk-c
        osc_account: oak
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: install dependancies
      run: |
        sudo apt-get update --fix-missing
        sudo apt-get install -y -f -o Acquire::Retries=3 jq libjson-c-dev libcurl4-openssl-dev pkg-config libjsoncpp-dev
    - name: local-test
      run: |
        CFLAGS="-fsanitize=address -O0" make ricochet_preparation
        make local-tests
        make fclean
    - name: Build and test
      run: |
        CFLAGS="-fsanitize=address -O0" make tests
        make fclean
      if: github.event_name != 'pull_request'
      env:
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
    - name: codeql-init
      uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7 # v4
    - name: codeql-make
      run: make examples ricochet_preparation
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v4

